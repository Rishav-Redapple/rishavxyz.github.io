<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" href="/rss.xml" type="application/rss+xml" title="Rishav Mandal" />
    <script data-goatcounter="https://rishavxyz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    %%css%%
    %%seo%%
  </head>
  <body>
    <header class="container site-header">
      <nav>
        <ul>
          <li><a href="/" class="brand">%%sitename%%</a></li>
        </ul>
        <ul>
          %%navlinks%%
          <li>
            <button id="btnTheme" class="contrast outline" onclick="toggleTheme()">Light</button>
          </li>
        </ul>
      </nav>
    </header>
    <hr style="margin: auto" class="container" />
    <main class="container">%%content%%</main>
    <hr style="margin: auto" class="container" />
    <footer class="container site-footer">
      <p><a href="/" class="brand">%%sitename%%</a></p>
      <nav>
        <ul>
          %%navlinks%%
        </ul>
      </nav>
      <p class="copy"><small>%%copyright%%</small></p>
    </footer>
    
    <script>
      const html = document.documentElement
      const savedTheme = sessionStorage.getItem('theme')
      const currentTheme = html.getAttribute('data-theme')

      const sun = `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="M11.034 19.741c.196-.73 1.139-.983 1.673-.448c.197.196.275.436.293.707v1c-.018.271-.096.511-.293.707c-.25.25-.624.351-.966.259c-.453-.122-.711-.515-.741-.966v-1Zm5.757-1.584c-.378-.654.11-1.5.866-1.5c.278 0 .503.114.707.293l.707.707c.179.204.293.43.293.707c0 .354-.193.689-.5.866c-.407.235-.868.139-1.207-.159l-.707-.707ZM6.602 16.691c.255.068.475.237.607.466c.235.406.139.867-.159 1.207l-.707.707c-.339.298-.8.394-1.207.159a1 1 0 0 1-.466-.607c-.096-.36.021-.695.259-.966l.707-.707c.271-.238.607-.356.966-.259m4.786 1.279a6.02 6.02 0 0 1-5.119-4.186C4.997 9.691 8.354 5.598 12.612 6.03a6.02 6.02 0 0 1 5.119 4.186c1.272 4.093-2.085 8.186-6.343 7.754m.202-9.948a4 4 0 0 0-2.133.892c-3.04 2.508-.966 7.461 2.953 7.064a4 4 0 0 0 2.133-.892c3.04-2.508.966-7.461-2.953-7.064m-8.849 4.944c-.73-.196-.983-1.139-.448-1.673c.196-.197.436-.275.707-.293h1c.271.018.511.096.707.293c.25.25.351.624.259.966c-.122.453-.515.711-.966.741H3Zm17 0c-.73-.196-.983-1.139-.448-1.673c.196-.197.436-.275.707-.293h1c.271.018.511.096.707.293c.25.25.351.624.259.966c-.122.453-.515.711-.966.741h-1ZM4.77 6.136c-.378-.654.11-1.5.866-1.5c.278 0 .503.114.707.293l.707.707c.179.204.293.429.293.707c0 .354-.193.689-.5.866c-.406.235-.867.139-1.207-.159l-.707-.707ZM18.623 4.67c.254.068.475.237.607.466c.235.406.139.867-.159 1.207l-.707.707c-.34.298-.8.394-1.207.159a1 1 0 0 1-.466-.607c-.096-.36.021-.695.259-.966l.707-.707c.271-.238.606-.355.966-.259m-7.589-1.929c.196-.73 1.139-.983 1.673-.448c.197.196.275.436.293.707v1c-.018.271-.096.511-.293.707c-.25.25-.624.351-.966.259c-.453-.122-.711-.515-.741-.966V3Z" /></svg>`
      const moon = `<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="M10.625 20.896a9 9 0 0 1-3.67-1.443a9.06 9.06 0 0 1-3.259-3.982a9 9 0 0 1-.42-1.26c-.164-.651-.327-1.384.419-1.736c.195-.092.419-.118.63-.074c.274.057.521.206.787.294l.607.167c.428.094.842.137 1.281.138a6.03 6.03 0 0 0 4.777-2.369a6.03 6.03 0 0 0 1.188-4.282a6 6 0 0 0-.269-1.237c-.188-.568-.537-1.046-.105-1.603a1 1 0 0 1 .331-.276c.198-.103.411-.127.63-.097c1.457.2 3.024.979 4.153 1.905c5.506 4.515 3.804 13.395-2.988 15.542a9.1 9.1 0 0 1-4.092.313m-5.001-6.015a7.1 7.1 0 0 0 1.849 2.457a7 7 0 0 0 3.887 1.633c4.849.439 8.686-4.14 7.387-8.84a7 7 0 0 0-1.409-2.658a7.1 7.1 0 0 0-2.457-1.849c.089.683.148 1.343.092 2.032c-.294 3.636-3.074 6.653-6.675 7.239c-.901.147-1.774.104-2.674-.014"/></svg>`

      const isdarkTheme = (theme) => theme === 'dark'

      window.theme = savedTheme || currentTheme || 'light'

      setTheme(theme)

      function setTheme(theme) {
        window.theme = theme
        btnTheme.innerHTML = isdarkTheme(theme) ? sun : moon
        html.setAttribute('data-theme', theme)
        sessionStorage.setItem('theme', theme)
      }

      function toggleTheme() {
        const changes = isdarkTheme(theme) ? 'light' : 'dark'
        setTheme(changes)
      }
    </script>
  </body>
</html>
